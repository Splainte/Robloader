name: build

# Construit les artefacts Windows (.exe + installeur) et macOS (.dmg) a chaque tag vX.Y.Z,
# ou manuellement (onglet Actions -> Run workflow). Attache les artefacts a la Release du tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build (.exe + installeur)
        shell: pwsh
        run: ./build_windows.ps1
      - name: Zip de l'app
        shell: pwsh
        run: Compress-Archive -Path dist/Robloader/* -DestinationPath Robloader-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Robloader-windows
          path: |
            Robloader-windows.zip
            installer/Output/Robloader-Setup.exe
      - name: Joindre a la release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Robloader-windows.zip
            installer/Output/Robloader-Setup.exe

  macos:
    runs-on: macos-14   # Apple Silicon (arm64)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build (.app + .dmg)
        run: |
          chmod +x build_macos.sh
          ./build_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Robloader-macos
          path: dist/Robloader.dmg
      - name: Joindre a la release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Robloader.dmg
