name: build

# Construit Robloader V2 (Tauri) pour Windows + macOS (DMG universal2 Intel+ARM)
# a chaque tag vX.Y.Z, ou manuellement (onglet Actions -> Run workflow). Attache les
# installeurs a la Release du tag.
#
# Livrables (noms natifs Tauri, attendus tels quels par l'updater interne pick_url dans engine.rs) :
#   - Windows : Robloader_<ver>_x64-setup.exe       (NSIS, binaires embarques)
#   - macOS   : Robloader_<ver>_universal.dmg       (Intel + Apple Silicon)
#
# macOS : on ne build PLUS sur runner Intel (macos-13, en retrait chez GitHub). A la place un
# DMG universal2 est produit sur xcode-27 (macOS 26 + Xcode 27, Apple Silicon) : binaires embarques fusionnes en
# fat binaries via lipo (cf prepare-bins.mjs, ROBLOADER_UNIVERSAL=1) + tauri build --target
# universal-apple-darwin. Un seul DMG universal couvre les deux branches de l'updater
# (aarch64 -> 1er .dmg ; Intel -> .dmg sans "aarch64").
#
# Xcode 27 : le look des fenetres (feux tricolores...) depend du SDK avec lequel l'app est
# liee. Liee a un vieux SDK (Xcode 15 de macos-14), macOS 27 garde l'ancien design.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      plateformes:
        description: "Plateformes a construire"
        type: choice
        options: [toutes, macos, windows]
        default: toutes

permissions:
  contents: write   # necessaire pour attacher les artefacts a la Release

jobs:
  build:
    strategy:
      fail-fast: false
      # Lancement manuel : on peut ne construire qu'une plateforme (input "plateformes").
      # Sur un tag, inputs est vide => les deux.
      # macOS = xcode-27 (Apple Silicon + SDK macOS 27) -> DMG universal2 (Intel + ARM).
      matrix:
        include: ${{ fromJSON(inputs.plateformes == 'macos' && '[{"platform":"xcode-27","artifact":"Robloader-macos","universal":"1","rust_target":"x86_64-apple-darwin","tauri_args":"-- --target universal-apple-darwin","glob":"tauri/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg"}]' || (inputs.plateformes == 'windows' && '[{"platform":"windows-latest","artifact":"Robloader-windows","universal":"0","rust_target":"","tauri_args":"","glob":"tauri/src-tauri/target/release/bundle/nsis/*-setup.exe"}]' || '[{"platform":"windows-latest","artifact":"Robloader-windows","universal":"0","rust_target":"","tauri_args":"","glob":"tauri/src-tauri/target/release/bundle/nsis/*-setup.exe"},{"platform":"xcode-27","artifact":"Robloader-macos","universal":"1","rust_target":"x86_64-apple-darwin","tauri_args":"-- --target universal-apple-darwin","glob":"tauri/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg"}]')) }}
    runs-on: ${{ matrix.platform }}
    env:
      ROBLOADER_UNIVERSAL: ${{ matrix.universal }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Toolchain Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cible Rust additionnelle (cross-arch macOS)
        if: matrix.rust_target != ''
        run: rustup target add ${{ matrix.rust_target }}

      - name: Cache cargo (registry + target)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tauri/src-tauri/target
          key: ${{ matrix.platform }}-${{ matrix.universal }}-cargo-${{ hashFiles('tauri/src-tauri/Cargo.lock') }}
          restore-keys: ${{ matrix.platform }}-${{ matrix.universal }}-cargo-

      - name: Dependances npm
        working-directory: tauri
        run: npm ci

      - name: Telecharger les binaires embarques (yt-dlp/ffmpeg/ffprobe/deno)
        working-directory: tauri
        run: npm run prepare-bins

      # Le cache cargo restaure target/, y compris les installeurs des builds
      # precedents : sans ce menage, l'artefact (et la Release) embarquerait
      # aussi les anciennes versions.
      - name: Supprimer les installeurs des builds precedents
        shell: bash
        run: rm -rf tauri/src-tauri/target/release/bundle tauri/src-tauri/target/universal-apple-darwin/release/bundle

      - name: Build Tauri (.dmg universal2 ou .exe)
        working-directory: tauri
        run: npm run tauri build ${{ matrix.tauri_args }}

      - name: Verifier Xcode + SDK lie
        if: runner.os == 'macOS'
        working-directory: tauri
        run: |
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          vtool -show-build src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app/Contents/MacOS/Robloader

      - name: Collecter le livrable
        shell: bash
        run: |
          mkdir -p out
          cp ${{ matrix.glob }} out/
          ls -la out/

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/*

  # Publie la Release UNE SEULE FOIS, avec les deux installeurs, apres la reussite des builds.
  # Conserve l'etat draft : Robin valide puis publie a la main (la publication declenche la
  # migration auto des utilisateurs V1, qui interrogent releases/latest).
  release:
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer les livrables
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Attacher a la release (draft)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: artifacts/**/*
