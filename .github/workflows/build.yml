name: build

# Construit Robloader V2 (Tauri) pour Windows + macOS (Apple Silicon & Intel) a chaque tag vX.Y.Z,
# ou manuellement (onglet Actions -> Run workflow). Attache les installeurs a la Release du tag.
#
# Livrables (noms natifs Tauri, attendus tels quels par l'updater interne pick_url dans engine.rs) :
#   - Windows         : Robloader_<ver>_x64-setup.exe   (NSIS, ffmpeg/ffprobe/yt-dlp/deno embarques)
#   - macOS Apple Sil. : Robloader_<ver>_aarch64.dmg
#   - macOS Intel      : Robloader_<ver>_x64.dmg
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # necessaire pour attacher les artefacts a la Release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            artifact: Robloader-windows
            # NSIS genere par Tauri : un seul installeur auto-suffisant.
            glob: tauri/src-tauri/target/release/bundle/nsis/*-setup.exe
          - platform: macos-14        # Apple Silicon (aarch64)
            artifact: Robloader-macos-arm
            glob: tauri/src-tauri/target/release/bundle/dmg/*.dmg
          - platform: macos-13        # Intel (x86_64)
            artifact: Robloader-macos-intel
            glob: tauri/src-tauri/target/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Toolchain Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo (registry + target)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tauri/src-tauri/target
          key: ${{ matrix.platform }}-cargo-${{ hashFiles('tauri/src-tauri/Cargo.lock') }}
          restore-keys: ${{ matrix.platform }}-cargo-

      - name: Dependances npm
        working-directory: tauri
        run: npm ci

      - name: Telecharger les binaires embarques (yt-dlp/ffmpeg/ffprobe/deno)
        working-directory: tauri
        run: npm run prepare-bins

      - name: Build Tauri (.app/.dmg ou .exe)
        working-directory: tauri
        run: npm run tauri build

      - name: Collecter le livrable
        shell: bash
        run: |
          mkdir -p out
          cp ${{ matrix.glob }} out/
          ls -la out/

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/*

  # Publie la Release UNE SEULE FOIS, avec les trois installeurs, apres la reussite des builds.
  # Conserve l'etat draft : Robin valide puis publie a la main (la publication declenche la
  # migration auto des utilisateurs V1, qui interrogent releases/latest).
  release:
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer les livrables des trois builds
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Attacher a la release (draft)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: artifacts/**/*
