name: build

# Construit les artefacts Windows (.exe + installeur) et macOS (.dmg) a chaque tag vX.Y.Z,
# ou manuellement (onglet Actions -> Run workflow). Attache les artefacts a la Release du tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # necessaire pour attacher les artefacts a la Release

env:
  # Les actions tournent encore sur Node 20 (deprecie le 16/06/2026) -> on opte pour Node 24.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build (.exe + installeur)
        shell: pwsh
        run: ./build_windows.ps1
      # Un SEUL livrable Windows : l'installeur auto-suffisant (ffmpeg/deno inclus). Plus de zip
      # portable -> equivalent direct du DMG macOS, pas de confusion pour l'utilisateur.
      - uses: actions/upload-artifact@v4
        with:
          name: Robloader-windows
          path: installer/Output/Robloader-Setup.exe
      - name: Joindre a la release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/Output/Robloader-Setup.exe

  macos:
    # Un SEUL job sur le runner Apple Silicon (macos-14). Les runners Intel (macos-13) sont en
    # cours de retrait chez GitHub -> on ne build plus Intel nativement. A la place on produit un
    # DMG UNIVERSAL2 (Intel + Apple Silicon) : Python universal2 de python.org + binaires embarques
    # fusionnes par lipo (cf build_macos.sh) + PyInstaller target_arch=universal2 (cf Robloader.spec).
    runs-on: macos-14
    env:
      ROBLOADER_TARGET_ARCH: universal2
    steps:
      - uses: actions/checkout@v4
      - name: Installer Python universal2 (python.org)
        # setup-python ne fournit qu'un Python arm64 sur Apple Silicon ; l'installeur officiel
        # python.org est universal2 (indispensable pour un .app universal2).
        run: |
          PY=3.12.8
          curl -fsSL -o /tmp/python.pkg "https://www.python.org/ftp/python/${PY}/python-${PY}-macos11.pkg"
          sudo installer -pkg /tmp/python.pkg -target /
          echo "/Library/Frameworks/Python.framework/Versions/3.12/bin" >> "$GITHUB_PATH"
      - name: Verifier que Python est bien universal2
        run: |
          which python3
          python3 -c "import sys; print(sys.version)"
          lipo -archs "$(python3 -c 'import sys; print(sys.executable)')"
      - name: Build (.app + .dmg universal2)
        run: |
          chmod +x build_macos.sh
          ./build_macos.sh
      - name: Renommer le DMG
        run: mv dist/Robloader.dmg dist/Robloader-macos.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: Robloader-macos
          path: dist/Robloader-macos.dmg
      - name: Joindre a la release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Robloader-macos.dmg
