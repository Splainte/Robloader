name: build

# Construit les artefacts Windows (.exe + installeur) et macOS (.dmg) a chaque tag vX.Y.Z,
# ou manuellement (onglet Actions -> Run workflow). Attache les artefacts a la Release du tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # necessaire pour attacher les artefacts a la Release

env:
  # Les actions tournent encore sur Node 20 (deprecie le 16/06/2026) -> on opte pour Node 24.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build (.exe + installeur)
        shell: pwsh
        run: ./build_windows.ps1
      - name: Zip de l'app
        shell: pwsh
        run: Compress-Archive -Path dist/Robloader/* -DestinationPath Robloader-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Robloader-windows
          path: |
            Robloader-windows.zip
            installer/Output/Robloader-Setup.exe
      - name: Joindre a la release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Robloader-windows.zip
            installer/Output/Robloader-Setup.exe

  macos:
    # macos-14 = Apple Silicon (arm64), macos-13 = Intel (x86_64).
    # build_macos.sh detecte l'archi via `uname -m` -> build natif sur chaque runner
    # (PyInstaller ne cross-compile pas). On produit donc DEUX DMG distincts.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64    # Apple Silicon (M1/M2/M3...)
          - runner: macos-13
            arch: intel    # Mac Intel (x86_64)
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build (.app + .dmg)
        run: |
          chmod +x build_macos.sh
          ./build_macos.sh
      - name: Renommer le DMG par architecture
        run: mv dist/Robloader.dmg "dist/Robloader-macos-${{ matrix.arch }}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: Robloader-macos-${{ matrix.arch }}
          path: dist/Robloader-macos-${{ matrix.arch }}.dmg
      - name: Joindre a la release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Robloader-macos-${{ matrix.arch }}.dmg
