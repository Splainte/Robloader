[package]
name = "robloader-tauri"
version = "2.0.0"
description = "Robloader — telechargeur video natif"
authors = ["Splainte"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "robloader_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api : requis pour une fenetre transparente sur macOS (Vibrancy)
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Materiaux natifs : Mica (Windows 11) + Vibrancy/NSVisualEffectView (macOS).
# Le crate compile partout mais n'agit que sur Windows et macOS.
window-vibrancy = "0.6"

# macOS : envoi de messages Obj-C dynamique pour corriger l'ancrage du
# contenu pendant l'animation de resize/zoom (deja tire par window-vibrancy)
# et pour appliquer le vrai Liquid Glass (NSGlassEffectView) sur macOS 26.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
# CGRect/CGGeometry : type de la frame passee a NSGlassEffectView.
objc2-core-foundation = { version = "0.3", features = ["CGGeometry"] }

